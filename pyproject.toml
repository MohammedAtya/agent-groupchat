[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-groupchat"
dynamic = ["version"]
description = "A local group chat between you and your AI agents (Claude Code, Codex, Antigravity, Gemini CLI, Aider, any OpenAI-compatible API), with roles and real permissions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MohammedAtya" }]
keywords = ["ai", "agents", "claude-code", "codex", "antigravity", "gemini", "gemini-cli", "aider", "group-chat", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/MohammedAtya/agent-groupchat"
Issues = "https://github.com/MohammedAtya/agent-groupchat/issues"

[project.scripts]
agent-groupchat = "agent_groupchat.server:main"

[tool.setuptools]
packages = ["agent_groupchat", "agent_groupchat.adapters"]

[tool.setuptools.dynamic]
version = { attr = "agent_groupchat.__version__" }

[tool.setuptools.package-data]
agent_groupchat = ["static/*.html"]
"agent_groupchat.adapters" = ["*.toml"]
