name: release

# Publishing a GitHub release (e.g. tag v0.1.0) builds the package and uploads it to PyPI.
# Uses PyPI "trusted publishing": no API token is stored anywhere. One-time setup on
# pypi.org -> Your projects -> Publishing -> add a (pending) GitHub publisher:
#   owner MohammedAtya, repository agent-groupchat, workflow release.yml, environment pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI verify this workflow (trusted publishing)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          v=$(python -c "import agent_groupchat; print(agent_groupchat.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
